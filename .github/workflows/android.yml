name: Build XA GHOST APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Publish direct APK in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk XA-GHOST.apk
          gh release delete v1.0-test --yes --cleanup-tag || true
          gh release create v1.0-test XA-GHOST.apk --title "XA GHOST v1.0 Test APK" --notes "Paired Bluetooth offline text chat. Experimental debug build; no end-to-end message encryption." --prerelease --target "$GITHUB_SHA"
